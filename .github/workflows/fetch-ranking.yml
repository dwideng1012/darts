name: Fetch Darts Ranking

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and save ranking
        run: |
          mkdir -p data
          START_DATE="$(TZ='Europe/Tallinn' date '+%d.%m.%Y')"
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          curl --fail --silent --show-error --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://darts.ee/ranking_ajax.php?start_date=${START_DATE}" \
            -o /tmp/raw.json

          python3 -c "
import json, os, sys
src, dst, now = sys.argv[1], sys.argv[2], sys.argv[3]
with open(src, encoding='utf-8') as f:
    raw = json.load(f)
assert isinstance(raw.get('data'), list), 'Missing data array in response'
new_data = raw['data']
try:
    with open(dst, encoding='utf-8') as f:
        existing = json.load(f)
    if existing.get('data') == new_data:
        print('Data unchanged, skipping write.')
        sys.exit(0)
except (FileNotFoundError, json.JSONDecodeError):
    pass
result = {'updated': now, 'data': new_data}
tmp = dst + '.tmp'
with open(tmp, 'w', encoding='utf-8') as f:
    json.dump(result, f, ensure_ascii=False, separators=(',', ':'))
os.replace(tmp, dst)
print('Data changed, wrote new file.')
" /tmp/raw.json data/ranking.json "$NOW"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ranking.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update ranking $(TZ='Europe/Tallinn' date '+%d.%m.%Y %H:%M')"
            git push
          fi
